plugins {
    id 'com.android.application'
}

android {
    namespace 'com.anoj.jarvis'
    compileSdk 35

    defaultConfig {
        applicationId "com.anoj.jarvis"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
}
